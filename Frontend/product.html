<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Asda Product Info</title>

	<link rel="stylesheet" href="index.css">
	<script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

	<main class="device-shell">
		<section class="scanner-app" aria-label="Asda product information">

			<!-- TOP BAR -->
			<div class="app-titlebar">

				<a
					class="icon-button"
					id="product-back-button"
					href="index.html"
					aria-label="Back to tasks"
				>
					<i
						class="app-icon"
						data-lucide="arrow-left"
						aria-hidden="true"
					></i>
				</a>

				<div class="tasks-title">
					<h1>PRODUCT INFO</h1>
				</div>

				<button
					class="icon-button menu-button"
					type="button"
					aria-label="More options"
				>
					<i data-lucide="more-vertical"></i>
				</button>

			</div>


			<!-- SEARCH -->
			<section
				class="product-search"
				id="product-search-section"
			>

				<label for="product-input">
					Enter UPC or product name
				</label>

				<div class="product-search-box">

					<input
						id="product-input"
						type="text"
						placeholder="UPC or product name"
						autocomplete="off"
					>

					<button
						id="product-search"
						type="button"
						aria-label="Search"
					>
						<i data-lucide="search"></i>
					</button>

				</div>

			</section>


			<!-- EMPTY / SEARCH MESSAGE -->
			<div
				class="product-empty"
				id="product-empty"
			>
				Enter a UPC or product name to search.
			</div>


			<!-- SEARCH RESULTS -->
			<div
				class="product-result-list"
				id="product-results"
				hidden
			></div>


			<!-- PRODUCT DETAILS -->
			<div
				class="product-detail-view"
				id="product-detail-view"
				hidden
			>

				<!-- PRODUCT HEADER -->
				<div class="product-card">

					<div class="product-card-media">

						<img
							id="detail-image"
							src=""
							alt="Product image"
						>

					</div>

					<div class="product-card-details">

						<h2 id="detail-name">
							Product Name
						</h2>

						<span id="detail-upc">
							UPC: -
						</span>

					</div>

					<button
						class="icon-button"
						type="button"
						aria-label="Product Options"
					>
						<i data-lucide="more-vertical"></i>
					</button>

				</div>


				<!-- LOCATION DETAILS LINK -->
				<button
					type="button"
					class="location-link"
				>
					View item location details
					(<span id="detail-loc-count">0</span> total)
				</button>


				<!-- CONNECTED STOCK / LOCATION STRIP -->
				<div class="stock-location-wrapper">

					<div class="stock-location-strip">

						<!-- PRIMARY LOCATION POINTER -->
						<div class="primary-location-pointer"></div>


						<!-- FIXED ON HAND SECTION -->
						<div class="onhand-module">

							<span class="metric-label">
								On Hand
							</span>

							<span class="metric-sub">
								STOCK
							</span>

							<span
								class="metric-value"
								id="detail-onhand"
							>
								0
							</span>

						</div>


						<!-- HORIZONTALLY SCROLLABLE LOCATIONS -->
						<div
							class="location-scroll"
							id="location-modules"
						></div>

					</div>

				</div>


				<!-- TABS -->
				<div class="product-info-tabs">

					<button
						type="button"
						class="tab-btn active"
						data-tab="info"
					>
						INFO
					</button>

					<button
						type="button"
						class="tab-btn"
						data-tab="sales"
					>
						SALES
					</button>

					<button
						type="button"
						class="tab-btn"
						data-tab="inventory"
					>
						INVENTORY
					</button>

				</div>


				<!-- TAB CONTENT -->
				<div
					class="product-info-tab-content"
					id="tab-content"
				>

					<div class="bay-image-section">

						<h3>
							Bay Image
						</h3>

						<div class="bay-info-line">

							<span id="bay-loc-text">
								-
							</span>

							<span>
								Shelf
								<span id="bay-shelf-num">
									-
								</span>
							</span>

							<span class="timestamp">
								@ 04:45 PM Yesterday
							</span>

						</div>

						<div class="bay-image-wrapper">

							<img
								id="bay-image"
								src=""
								alt="Bay location image"
							>

						</div>

						<div class="stock-timeline" id="stock-timeline"></div>

					</div>

				</div>

			</div>


			<!-- BOTTOM NAVIGATION -->
			<nav
				class="bottom-nav"
				aria-label="Main navigation"
			>

				<a
					class="nav-link"
					href="index.html"
				>
					<i data-lucide="clipboard-list"></i>
					TASKS
				</a>

				<a
					class="nav-link active"
					href="product.html"
				>
					<i data-lucide="scan-barcode"></i>
					PRODUCT INFO
				</a>

				<button type="button">
					<i data-lucide="undo-2"></i>
					REVERSE
				</button>

				<button type="button">
					<i data-lucide="more-vertical"></i>
					MORE
				</button>

			</nav>

		</section>
	</main>


	<script src="product.js"></script>

</body>
</html>
