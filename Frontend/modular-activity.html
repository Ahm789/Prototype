<!DOCTYPE html>
<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta
		name="viewport"
		content="width=device-width, initial-scale=1.0"
	>

	<title>Modular Activity</title>

	<link
		rel="stylesheet"
		href="index.css"
	>

	<script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>

	<main class="device-shell">

		<section
			class="scanner-app"
			aria-label="Asda modular activity"
		>


			<!-- =====================================================
			     TOP BAR
			====================================================== -->

			<div class="app-titlebar">

				<button
					class="icon-button modular-activity-back"
					type="button"
					id="modular-activity-back"
					aria-label="Back to modular activity"
				>

					<i
						data-lucide="arrow-left"
						aria-hidden="true"
					></i>

				</button>


				<div class="tasks-title modular-activity-title">

					<h1 id="modular-activity-name">
						MODULAR
					</h1>


					<div class="modular-activity-subtitle">
						MODULAR ACTIVITY
					</div>

				</div>


                <button
					class="icon-button menu-button"
					aria-label="More options"
				>
					<i data-lucide="more-vertical"></i>
				</button>

			</div>


			<!-- =====================================================
			     MODULAR ACTIVITY CONTENT
			====================================================== -->

			<div class="task-list">

				<!-- Content will be added here -->
                 <!-- =====================================================
                    SCAN MODE BAR
                ====================================================== -->

                <div class="modular-scan-mode">

                    <div class="modular-scan-mode-label">

                        <i
                            data-lucide="info"
                            aria-hidden="true"
                        ></i>

                        <span>
                            Scan Mode
                        </span>

                    </div>


                    <div class="modular-scan-mode-toggle">

                        <span class="modular-scan-smart">
                            Smart
                        </span>


                        <label class="scan-mode-switch">

                            <input
                                type="checkbox"
                                id="scan-mode-toggle"
                            >

                            <span class="scan-mode-slider"></span>

                        </label>


                        <span class="modular-scan-standard">
                            Standard
                        </span>

                    </div>

                </div>
                <!-- =====================================================
                    MODULAR PRODUCT VISUAL
                ====================================================== -->

                <div
                    class="modular-activity-product-visual"
                    id="modular-activity-product-visual"
                >
                    <div class="modular-activity-product-loading">
                        Loading modular...
                    </div>
                </div>

			</div>
            <!-- =====================================================
                MODULAR ACTIVITY ACTION BAR
            ====================================================== -->

            <div class="modular-activity-action-bar">

                <button
                    type="button"
                    class="modular-activity-action modular-activity-end"
                    id="modular-activity-end"
                >
                    End Task
                </button>


                <button
                    type="button"
                    class="modular-activity-action modular-activity-clear"
                    id="modular-activity-clear"
                >
                    Clear All
                </button>


                <button
                    type="button"
                    class="modular-activity-action modular-activity-next"
                    id="modular-activity-next"
                    disabled
                >
                    Next (../...)
                </button>

            </div>

		</section>

	</main>


	<!-- =========================================================
	     BARCODE / IMAGE DEPENDENCIES
	========================================================= -->

	<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

	<script src="barcode-scanner.js"></script>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


	<!-- =========================================================
	     MODULAR ACTIVITY JAVASCRIPT
	========================================================= -->

	<script src="modular-activity.js"></script>


</body>

</html>
