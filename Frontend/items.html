<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asda Product Info</title>
    <link rel="stylesheet" href="items.css">
</head>
<body>
    <main class="items-app">
        <header class="items-header">
            <a href="index.html" class="back-link" aria-label="Back to tasks">‹</a>
            <div>
                <p>PRODUCT INFO</p>
                <h1>Item database</h1>
            </div>
            <span class="database-status" id="database-status">Local database</span>
        </header>

        <section class="items-layout">
            <div class="item-form-column">
                <form class="item-form" id="item-form">
                    <div class="form-heading">
                        <div><span class="eyebrow">ITEM RECORD</span><h2 id="form-title">New item</h2></div>
                        <div class="form-heading-actions">
                            <button type="button" class="new-item" id="new-item">New item</button>
                            <button type="reset" class="clear-form">Clear</button>
                        </div>
                    </div>

                    <div class="form-grid">
                        <label>UPC<input name="upc" required inputmode="numeric" placeholder="Enter UPC"></label>
                        <label>ASDA item number<input name="itemNumber" required placeholder="Enter item number"></label>
                        <label class="wide">Description<input name="description" required placeholder="Enter item description"></label>
                        <label>Price<input name="price" type="number" min="0" step="0.01" placeholder="Defaults to £1.00"></label>
                        <label>On hand<input name="onHand" type="number" min="0" step="1" placeholder="Defaults to 0"></label>
                        <label>Case size<input name="caseSize" type="number" min="0" step="1" placeholder="Defaults to 0"></label>
                        <label>Max shelf<input name="maxShelf" type="number" min="0" step="1" placeholder="Defaults to 0"></label>
                        <label>Department<input name="department" placeholder="Defaults to 9999"></label>
                        <label>Range status<select name="rangeStatus"><option value="in-range">In range</option><option value="soon-ending">Soon to be ending</option><option value="ended">Ended</option><option value="soon-in-range">Soon to be in range</option></select></label>
                        <label class="wide">Image URL<input name="imageUrl" type="url" placeholder="Optional image URL"></label>
                        <label class="wide">Or upload image<input name="imageFile" type="file" accept="image/*"></label>
                    </div>

                    <button class="save-item" id="save-item" type="submit" disabled>Save item</button>
                    <p class="form-message" id="form-message" role="status"></p>
                </form>

                <!-- LOCATIONS PANEL -->
                <!-- An item can have zero, one, or many locations. This
                     panel is independent of the item form above: locations
                     are added/removed against a saved item's UPC directly,
                     so it only becomes usable once an item exists. -->
                <section class="locations-panel" id="locations-panel" hidden>
                    <div class="form-heading">
                        <div><span class="eyebrow">LOCATIONS</span><h2>Where this item lives</h2></div>
                        <span id="location-count">0 locations</span>
                    </div>

                    <div class="location-list" id="location-list"></div>

                    <form class="location-form" id="location-form">
                        <div class="location-grid">
                            <label>Aisle<input name="locAisle" placeholder="Optional"></label>
                            <label>Aisle side<input name="locAisleSide" placeholder="Optional"></label>
                            <label>Bay<input name="locBay" placeholder="Optional"></label>
                            <label>Shelf<input name="locShelf" placeholder="Optional"></label>
                            <label class="wide">Modular ID<input name="locModularId" placeholder="Auto-generated as FF-aisle-side-bay-shelf if left blank"></label>
                        </div>
                        <label class="location-primary-check">
                            <input type="checkbox" name="locIsPrimary">
                            Set as primary location
                        </label>
                        <button type="submit" class="add-location">Add location</button>
                    </form>
                </section>

                <p class="locations-hint" id="locations-hint">Save the item first, then add its locations here.</p>
            </div>

            <section class="saved-items" aria-labelledby="saved-items-heading">
                <div class="saved-items-heading"><div><span class="eyebrow">DATABASE</span><h2 id="saved-items-heading">Saved items</h2></div><span id="item-count">0 items</span></div>
                <div class="items-list" id="items-list"></div>
            </section>
        </section>
    </main>
    <script src="items-page.js"></script>
</body>
</html>
