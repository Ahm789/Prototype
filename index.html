<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Asda Tasks</title>
	<link rel="stylesheet" href="index.css">
    <script src="inventory-db.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
	<main class="device-shell">
		<section class="scanner-app" aria-label="Asda stock tasks">

			<div class="app-titlebar">
                <button class="icon-button app-menu-button" type="button" aria-label="Open product info">
                    <i class="app-icon" data-lucide="clipboard" aria-hidden="true"></i>
                </button>

                <div class="tasks-title">
                    <h1>TASKS</h1>
                    <div class="task-timer" aria-label="Task timer">
                        <button id="task-clock" type="button" aria-label="Advance clock by one hour"><span id="task-timer-value">9:00:00 am</span></button>
                    </div>
                </div>

                <button class="icon-button menu-button" aria-label="More options">
                    <i data-lucide="more-vertical"></i>
                </button>
            </div>

			<div class="task-controls">
                <div class="open-count">
                    0 <span>Open</span> <small>(0% <i data-lucide="check"></i>)</small>
                </div>

                <div class="selection-group" aria-label="Task selection controls">
                    <span class="view-toggle" aria-hidden="true">
                        <span class="collapse-icon" aria-hidden="true"></span>
                    </span>
                    <button class="selection-slider" aria-label="Toggle task selection"><span></span></button>
                </div>

                <button class="filter-button" aria-label="Open filters">
                    <i data-lucide="sliders-horizontal"></i>
                    <span>Filters (0)</span>
                </button>
            </div>

            <div class="filter-panel" hidden>
                <div class="filter-panel-header"><strong>Filters</strong><button class="close-filters" aria-label="Close filters">×</button></div>
                <div class="filter-fields">
                    <label>Task status<select><option>Open tasks</option><option>Backroom</option><option>Shop floor</option></select></label>
                    <label>Department<select><option>All departments</option><option>Bakery &amp; Frozen</option><option>Fresh Foods</option></select></label>
                </div>
                <div class="filter-actions">
                    <button class="reset-filters">Reset</button>
                    <button class="apply-filters">Apply filters</button>
                </div>
            </div>

            <section class="task-list" aria-label="Current item tasks">
                <div class="task-empty" id="task-empty">Tasks will appear when the next hour starts.</div>
                <div class="task-cards" id="task-cards"></div>
            </section>

		

			<nav class="bottom-nav" aria-label="Main navigation">
                <button class="active">
                    <i data-lucide="clipboard-list"></i>
                    TASKS
                </button>

                <a class="nav-link" href="items.html">
                    <i data-lucide="scan-barcode"></i>
                    PRODUCT INFO
                </a>

                <button>
                    <i data-lucide="undo-2"></i>
                    REVERSE
                </button>

                <button>
                    <i data-lucide="more-vertical"></i>
                    MORE
                </button>
            </nav>

            <script>
                lucide.createIcons();
            </script>
		</section>
	</main>
	<script>
		document.querySelectorAll('.round-action').forEach((button) => {
			button.addEventListener('click', () => {
				button.classList.add('pressed');
				setTimeout(() => button.classList.remove('pressed'), 180);
			});
		});
        const selectionSlider = document.querySelector('.selection-slider');
        const selectionStateKey = 'asda-task-selection-state';
        selectionSlider.classList.toggle('is-on', localStorage.getItem(selectionStateKey) === 'on');
        selectionSlider.addEventListener('click', () => {
            const isOn = selectionSlider.classList.toggle('is-on');
			localStorage.setItem(selectionStateKey, isOn ? 'on' : 'off');
		});
        const filterPanel = document.querySelector('.filter-panel');
        const scannerApp = document.querySelector('.scanner-app');
        const filterButton = document.querySelector('.filter-button');
        const closeFilters = document.querySelector('.close-filters');
        const resetFilters = document.querySelector('.reset-filters');
        const applyFilters = document.querySelector('.apply-filters');
        const filterLabel = filterButton.querySelector('span');
        const filterSelects = document.querySelectorAll('.filter-panel select');
        const taskCards = document.querySelector('#task-cards');
        const taskEmpty = document.querySelector('#task-empty');
        const departmentNames = {
            '71': 'Meat, Fish & World Food',
            '72': 'Vegetables, Chips & Yorkshire Puddings',
            '73': 'Ice Cream, Desserts, Cakes & Fruit',
            '91': 'Free From, Pizza, Ready Meals & Party Food'
        };
        const renderRandomTasks = async () => {
            const items = await window.inventoryDatabase.getItems();
            const selectedItems = [...items].sort(() => Math.random() - 0.5).slice(0, Math.min(3, items.length));
            taskCards.replaceChildren();
            taskEmpty.hidden = selectedItems.length > 0;
            selectedItems.forEach((item) => {
                const card = document.createElement('article');
                card.className = 'task-card';
                const heading = document.createElement('div');
                heading.className = 'task-card-heading';
                heading.innerHTML = `<span>OOS - ${item.description}</span><i class="task-chevron" data-lucide="chevron-down" aria-hidden="true"></i>`;
                card.appendChild(heading);
                const body = document.createElement('div');
                body.className = 'task-card-body';
                const visual = document.createElement('div');
                visual.className = 'task-card-visual';
                if (item.image?.url) {
                    const image = document.createElement('img');
                    image.src = item.image.url;
                    image.alt = item.image.alt || item.description;
                    visual.appendChild(image);
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'task-card-placeholder';
                    placeholder.textContent = 'No image';
                    visual.appendChild(placeholder);
                }
                const inventoryAction = document.createElement('button');
                inventoryAction.type = 'button';
                inventoryAction.className = 'task-action task-action-inventory';
                inventoryAction.setAttribute('aria-label', 'Inventory action');
                inventoryAction.innerHTML = '<i data-lucide="archive"></i>';
                body.appendChild(visual);
                const rightContent = document.createElement('div');
                rightContent.className = 'task-card-right';
                const meta = document.createElement('div');
                meta.className = 'task-card-meta';
                meta.innerHTML = `<span>Dept. Bakery &amp; Frozen (004)</span><span>Aisle ${item.aisle || '—'}</span><span>Side ${item.aisleSide || '—'}</span><span>Bay ${item.bay || '—'}</span>`;
                rightContent.appendChild(meta);
                const details = document.createElement('div');
                details.className = 'task-card-details';
                details.innerHTML = `<p><span>UPC</span>${item.upc}</p><p><span>On Hand</span>${item.onHand ?? 0} Units</p><p><span>Price</span>£${Number(item.price ?? 1).toFixed(2)}</p><p><span>Case Size</span>${item.caseSize ?? 0} Units</p><p><span>Item</span>${item.itemNumber}</p><p><span>MAX SHELF</span>${item.maxShelf ?? 0} Units</p>`;
                rightContent.appendChild(details);
                body.appendChild(rightContent);
                card.appendChild(body);
                const actions = document.createElement('div');
                actions.className = 'task-card-actions';
                actions.appendChild(inventoryAction);
                const responseActions = document.createElement('div');
                responseActions.className = 'task-response-actions';
                [
                    ['thumbs-down', 'Mark unavailable'],
                    ['shopping-cart', 'Send to backroom'],
                    ['thumbs-up', 'Mark available']
                ].forEach(([icon, label], index) => {
                    const action = document.createElement('button');
                    action.type = 'button';
                    action.className = `task-action task-action-${index + 1}`;
                    action.setAttribute('aria-label', label);
                    action.innerHTML = `<i data-lucide="${icon}"></i>`;
                    responseActions.appendChild(action);
                });
                actions.appendChild(responseActions);
                card.appendChild(actions);
                taskCards.appendChild(card);
            });
            lucide.createIcons();
        };
        document.querySelector('.app-menu-button').addEventListener('click', () => {
            window.location.href = 'items.html';
        });
        let clockHour = 9;
        let clockMinute = 0;
        let clockSecond = 0;
        let clockPeriod = 'am';
        const timerValue = document.querySelector('#task-timer-value');
        const renderTimer = () => {
            timerValue.textContent = `${clockHour}:${clockMinute.toString().padStart(2, '0')}:${clockSecond.toString().padStart(2, '0')} ${clockPeriod}`;
        };
        document.querySelector('#task-clock').addEventListener('click', () => {
            clockMinute = 59;
            clockSecond = 55;
            renderTimer();
        });
        setInterval(() => {
            clockSecond += 1;
            if (clockSecond === 60) {
                clockSecond = 0;
                clockMinute += 1;
            }
            if (clockMinute === 60) {
                clockMinute = 0;
                clockHour += 1;
                if (clockHour === 12) {
                    clockPeriod = clockPeriod === 'am' ? 'pm' : 'am';
                } else if (clockHour > 12) {
                    clockHour = 1;
                }
                renderRandomTasks();
            }
            renderTimer();
        }, 1000);
        renderTimer();
        const setFiltersOpen = (isOpen) => {
            filterPanel.hidden = !isOpen;
            scannerApp.classList.toggle('filters-open', isOpen);
        };
        filterButton.addEventListener('click', () => { setFiltersOpen(filterPanel.hidden); });
        closeFilters.addEventListener('click', () => { setFiltersOpen(false); });
        resetFilters.addEventListener('click', () => {
            filterSelects.forEach((select) => { select.selectedIndex = 0; });
            filterLabel.textContent = 'Filters (0)';
        });
        applyFilters.addEventListener('click', () => {
            setFiltersOpen(false);
            filterLabel.textContent = 'Filters (1)';
        });
	</script>
</body>
</html>
